<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produk & Stok — BalasWA</title><link rel="stylesheet" href="/app.css"><style>.composer{display:none;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:24px}.composer.show{display:block}.product-form{display:grid;grid-template-columns:1.3fr .7fr .7fr .55fr auto;gap:10px;align-items:end}.summary{display:flex;gap:28px;margin:20px 0}.metric{font-size:11px;color:var(--muted)}.metric b{display:block;color:var(--ink);font-size:21px}.stock{width:76px}.state{font-size:10px;font-weight:800;color:var(--green)}.state.zero{color:var(--red)}@media(max-width:800px){.product-form{grid-template-columns:1fr 1fr}.product-form button{grid-column:1/-1}}@media(max-width:520px){.product-form{grid-template-columns:1fr}}</style></head><body><div class="shell"><aside class="side"><a class="brand" href="/"><span class="mark">BW</span>BalasWA</a><nav class="nav"><a href="/app">WhatsApp & Bot</a><a href="/app/profile">Profil Usaha</a><a class="active" href="/app/products">Produk & Stok</a><a href="/app/history">Riwayat</a></nav><div class="account"><small id="email">Memuat…</small><button class="logout" id="logout">Keluar</button></div></aside><main class="main"><header class="head"><div><h1>Produk & Stok</h1><p>Katalog aktif menjadi sumber harga dan ketersediaan bot.</p></div><button class="btn primary" id="new">Tambah produk</button></header><form class="composer" id="form"><div class="product-form"><div><label>Nama produk *</label><input name="name" required></div><div><label>Harga *</label><input name="price" type="number" min="0" required></div><div><label>Stok *</label><input name="stock" type="number" min="0" required></div><div><label>Satuan</label><input name="unit" value="pcs"></div><button class="btn primary">Simpan produk</button></div></form><div class="summary"><div class="metric"><b id="total">0</b>Total produk</div><div class="metric"><b id="available">0</b>Tersedia</div><div class="metric"><b id="soldout">0</b>Stok habis</div></div><div class="table"><table><thead><tr><th>Produk</th><th>Harga</th><th>Stok</th><th>Status bot</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div></main></div><div class="toast" id="toast"></div><div class="overlay" id="activation"></div><script src="/activation.js"></script><script>
let products=[],profile,wa;const rows=document.querySelector('#rows'),toast=document.querySelector('#toast'),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o){const r=await fetch(u,o);if(r.status===401){location='/login';throw Error('Sesi berakhir')}const d=await r.json();if(!r.ok)throw Error(d.error||'Gagal');return d}function say(x){toast.textContent=x;toast.className='toast show';setTimeout(()=>toast.className='toast',2500)}function render(){document.querySelector('#total').textContent=products.length;document.querySelector('#available').textContent=products.filter(x=>x.stock>0&&x.is_active).length;document.querySelector('#soldout').textContent=products.filter(x=>!x.stock).length;rows.innerHTML=products.length?products.map(p=>`<tr data-id="${p.id}"><td><b>${esc(p.name)}</b><br><small>${esc(p.category||p.sku||'Tanpa kategori')}</small></td><td>Rp${Number(p.price).toLocaleString('id-ID')}</td><td><input class="stock" type="number" min="0" value="${p.stock}"> <span class="state ${p.stock?'':'zero'}">${p.stock?'Tersedia':'Habis'}</span></td><td><select class="active"><option value="1" ${p.is_active?'selected':''}>Aktif</option><option value="0" ${!p.is_active?'selected':''}>Nonaktif</option></select></td><td><button class="btn quiet save">Simpan</button> <button class="btn danger del">Hapus</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">Belum ada produk.</td></tr>'}async function load(){const[me,b,w]=await Promise.all([api('/api/user/me'),api('/api/business'),api('/api/wa/status')]);document.querySelector('#email').textContent=me.email;products=b.products;profile=b.profile;wa=w;render();renderActivation({profile,products,wa})}document.querySelector('#new').onclick=()=>document.querySelector('#form').classList.toggle('show');document.querySelector('#form').onsubmit=async e=>{e.preventDefault();try{await api('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();e.target.unit.value='pcs';await load();say('Produk ditambahkan')}catch(e){say(e.message)}};rows.onclick=async e=>{const tr=e.target.closest('tr');if(!tr)return;const p=products.find(x=>x.id==tr.dataset.id);try{if(e.target.classList.contains('save'))await api('/api/products/'+p.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...p,stock:Number(tr.querySelector('.stock').value),is_active:tr.querySelector('.active').value==='1'})});if(e.target.classList.contains('del')&&confirm('Hapus produk?'))await api('/api/products/'+p.id,{method:'DELETE'});await load();say('Katalog diperbarui')}catch(e){say(e.message)}};document.querySelector('#logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location='/'};load().catch(e=>say(e.message));
</script></body></html>
