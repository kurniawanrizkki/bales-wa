<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riwayat Balasan — BalasWA</title><style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');:root{--ink:#181520;--muted:#6d6675;--purple:#6d45d7;--line:#e7e0f0;--red:#ae414c}*{box-sizing:border-box}body{margin:0;font-family:Manrope,sans-serif;color:var(--ink);background:#fff}a{text-decoration:none;color:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{border-right:1px solid var(--line);padding:26px 18px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;margin:0 8px 36px}.mark{width:34px;height:34px;border-radius:9px;background:var(--purple);color:#fff;display:grid;place-items:center;font-size:12px}.nav a{display:block;padding:11px 12px;border-radius:8px;color:#696171;font-size:13px;margin-bottom:5px}.nav a.active{background:#eee8fa;color:var(--purple);font-weight:800}.account{margin-top:auto;border-top:1px solid var(--line);padding:18px 8px 0}.account small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis}.logout{border:0;background:none;color:var(--red);font:inherit;font-size:12px;padding:10px 0}.main{padding:46px clamp(24px,5vw,64px);max-width:1350px;width:100%;margin:auto}.head{border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:20px}.head h1{font-size:35px;letter-spacing:-.045em;margin:0 0 7px}.head p{margin:0;color:var(--muted);font-size:13px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:18px 0}.toolbar span{font-size:11px;color:var(--muted)}button{border:1px solid var(--line);background:#fff;border-radius:8px;height:38px;padding:0 13px;font:inherit;font-size:11px;font-weight:800;cursor:pointer}.table{overflow:auto;border-top:1px solid var(--line)}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;padding:12px 10px;color:#837b8a;font-size:9px;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--line)}td{padding:15px 10px;border-bottom:1px solid #f0ebf4;vertical-align:top;line-height:1.55}.time{white-space:nowrap;color:var(--muted)}.reply{color:#4e376b}.empty{text-align:center;color:var(--muted);padding:48px}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:block;padding:14px 18px;border-right:0;border-bottom:1px solid var(--line)}.brand{margin:0 0 12px}.nav{display:flex;overflow:auto;gap:4px}.nav a{white-space:nowrap}.account{display:none}.main{padding:30px 18px}}@media(max-width:520px){.head h1{font-size:29px}}
</style></head><body><div class="shell"><aside class="side"><a class="brand" href="/"><span class="mark">BW</span>BalasWA</a><nav class="nav"><a href="/app">WhatsApp & Bot</a><a href="/app/profile">Profil Usaha</a><a href="/app/products">Produk & Stok</a><a class="active" href="/app/history">Riwayat</a></nav><div class="account"><small id="email">Memuat…</small><button class="logout" id="logout">Keluar</button></div></aside><main class="main"><header class="head"><h1>Riwayat Balasan</h1><p>Jejak pesan bisnis yang diproses oleh bot.</p></header><div class="toolbar"><span id="count">Memuat…</span><button id="refresh">Perbarui</button></div><div class="table"><table><thead><tr><th>Waktu</th><th>Pengirim</th><th>Pesan masuk</th><th>Balasan bot</th></tr></thead><tbody id="rows"></tbody></table></div></main></div><script>
const rows=document.querySelector('#rows'),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u){const r=await fetch(u);if(r.status===401){location='/login';throw Error('Sesi berakhir')}return r.json()}async function load(){const [me,d]=await Promise.all([api('/api/user/me'),api('/api/wa/status')]);document.querySelector('#email').textContent=me.email;document.querySelector('#count').textContent=`${d.logs.length} balasan terbaru`;rows.innerHTML=d.logs.length?d.logs.map(x=>`<tr><td class="time">${new Date(x.created_at+'Z').toLocaleString('id-ID')}</td><td>${esc(x.sender_number)}</td><td>${esc(x.sender_message)}</td><td class="reply">${esc(x.bot_reply)}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">Belum ada balasan bot.</td></tr>'}document.querySelector('#refresh').onclick=load;document.querySelector('#logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location='/'};load();
</script></body></html>
