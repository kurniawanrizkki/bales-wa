<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profil Usaha — BalasWA</title><link rel="stylesheet" href="/app.css"></head><body><div class="shell"><aside class="side"><a class="brand" href="/"><span class="mark">BW</span>BalasWA</a><nav class="nav"><a href="/app">WhatsApp & Bot</a><a class="active" href="/app/profile">Profil Usaha</a><a href="/app/products">Produk & Stok</a><a href="/app/history">Riwayat</a></nav><div class="account"><small id="email">Memuat…</small><button class="logout" id="logout">Keluar</button></div></aside><main class="main"><header class="head"><div><h1>Profil Usaha</h1><p>Fakta dasar yang dipakai bot saat menjawab pelanggan.</p></div></header><form id="form"><section class="section"><h2>Identitas</h2><p class="desc">Nama, kategori, dan ringkasan usaha.</p><div class="grid2"><div><label>Nama usaha *</label><input name="business_name" required></div><div><label>Kategori</label><input name="category" placeholder="Fashion, kuliner, jasa"></div><div class="full"><label>Deskripsi singkat</label><textarea name="description"></textarea></div><div><label>Nomor admin</label><input name="admin_phone" placeholder="0812..."></div><div><label>Jam operasional</label><input name="operating_hours" placeholder="Senin–Sabtu, 08.00–20.00"></div></div></section><section class="section"><h2>Lokasi & transaksi</h2><p class="desc">Informasi kunjungan, pembayaran, dan pengiriman.</p><div class="grid2"><div class="full"><label>Alamat lengkap</label><textarea name="address"></textarea></div><div class="full"><label>Tautan Google Maps</label><input name="maps_url" type="url"></div><div class="full"><label>Metode pembayaran</label><textarea name="payment_methods"></textarea></div><div class="full"><label>Pengiriman / pengambilan</label><textarea name="shipping_policy"></textarea></div></div></section><div class="bar"><button class="btn primary">Simpan profil</button></div></form></main></div><div class="toast" id="toast"></div><div class="overlay" id="activation"></div><script src="/activation.js"></script><script>
const form=document.querySelector('#form'),toast=document.querySelector('#toast');let state={profile:null,products:[],wa:null};async function api(u,o){const r=await fetch(u,o);if(r.status===401){location='/login';throw Error('Sesi berakhir')}const d=await r.json();if(!r.ok)throw Error(d.error||'Gagal');return d}function say(x){toast.textContent=x;toast.className='toast show';setTimeout(()=>toast.className='toast',2500)}async function load(){const[me,b,wa]=await Promise.all([api('/api/user/me'),api('/api/business'),api('/api/wa/status')]);document.querySelector('#email').textContent=me.email;state={profile:b.profile,products:b.products,wa};if(b.profile)Object.entries(b.profile).forEach(([k,v])=>{if(form.elements[k])form.elements[k].value=v||''});renderActivation(state)}form.onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/business',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});state.profile=d.profile;say('Profil tersimpan');renderActivation(state)}catch(e){say(e.message)}};document.querySelector('#logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location='/'};load().catch(e=>say(e.message));
</script></body></html>
